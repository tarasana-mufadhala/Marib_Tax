name: CI Runner (temporary diagnostics)

# Temporary diagnostics for the lint cleanup on PR #83 (added 2026-10-13).
# Exports full lint/typecheck/test/build/format output to the ci-report/lint
# branch because the remote workspace cannot install npm packages.
# REMOVE this file and delete the ci-report/lint branch before merging PR #83.
on:
  push:
    branches:
      - 'security/integrated-remediation-20261013'

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Collect reports
        shell: bash
        run: |
          mkdir -p /tmp/reports
          pnpm --filter @marib-tax/contracts build > /tmp/reports/contracts-build.log 2>&1 || true
          pnpm exec eslint apps/api/src apps/api/test packages/contracts/src packages/contracts/test -f json -o /tmp/reports/eslint.json || true
          pnpm typecheck > /tmp/reports/typecheck.log 2>&1; echo "exit=$?" >> /tmp/reports/typecheck.log
          pnpm test > /tmp/reports/test.log 2>&1; echo "exit=$?" >> /tmp/reports/test.log
          pnpm build > /tmp/reports/build.log 2>&1; echo "exit=$?" >> /tmp/reports/build.log
          pnpm format:check > /tmp/reports/format.log 2>&1; echo "exit=$?" >> /tmp/reports/format.log
          git rev-parse HEAD > /tmp/reports/source-sha.txt
      - name: Publish reports to ci-report/lint
        shell: bash
        run: |
          cd /tmp/reports
          git init -q -b ci-report/lint
          git config user.name "ci-runner"
          git config user.email "ci-runner@users.noreply.github.com"
          git add -A
          git commit -q -m "reports for $(cat source-sha.txt)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-report/lint:ci-report/lint
