name: Foundation CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation-validation:
    name: Repository foundation validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate foundation structure
        run: bash scripts/validate-foundation.sh

      - name: Enable Corepack
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate OpenAPI
        run: pnpm validate:openapi

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Check whitespace on pull request diff
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"

      - name: Check whitespace on push to main
        if: github.event_name == 'push'
        run: git show --check --oneline --format= HEAD

  flutter-validation:
    name: Flutter analyze, test, and debug build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Flutter source changes
        id: flutter-changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="origin/${{ github.base_ref }}...HEAD"
          else
            range="HEAD^...HEAD"
          fi
          if git diff --name-only "$range" | grep -Eq '^(apps/mobile/|\.github/workflows/foundation-ci\.yml$)'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter
        if: steps.flutter-changes.outputs.changed == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        if: steps.flutter-changes.outputs.changed == 'true'
        run: flutter pub get

      - name: Analyze
        if: steps.flutter-changes.outputs.changed == 'true'
        run: flutter analyze

      - name: Test
        if: steps.flutter-changes.outputs.changed == 'true'
        run: flutter test

      - name: Build Android debug APK
        if: steps.flutter-changes.outputs.changed == 'true'
        run: flutter build apk --debug --no-pub

  web-e2e:
    name: Playwright Web E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright Web E2E
        run: pnpm test:e2e:web
