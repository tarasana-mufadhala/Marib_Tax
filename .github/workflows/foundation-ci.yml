name: Foundation CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation-validation:
    name: Repository foundation validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate foundation structure
        run: bash scripts/validate-foundation.sh

      - name: Check for conflict markers and whitespace errors
        run: git diff --check
