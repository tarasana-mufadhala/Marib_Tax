openapi: 3.1.0
info:
  title: Marib Tax API
  version: 1.0.0
  description: Authoritative API-01 foundation. Business operations use the /api/v1 prefix.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:{port}
    description: Local development placeholder
    variables:
      port:
        default: '3000'
x-business-api-prefix: /api/v1
x-permission-codes:
  catalog: '@marib-tax/contracts#permissionCodes'
  rule: Every business operation must declare one approved x-permission value.
x-authorization-predicates:
  - OWNERSHIP
  - ACTIVE_ASSIGNMENT
  - OFFICE_SCOPE
  - UNIT_SCOPE
  - RESOURCE_STATE
  - SEPARATION_OF_DUTIES
  - REQUIRED_EVIDENCE
tags:
  - name: Requests
    description: Taxpayer-owned service request contracts.
  - name: Taxpayer registry
    description: Owned taxpayer, legal-entity, and tax-number read models (mock/in-memory only).
  - name: Master data
    description: Owned commercial-activity, branch, address, and property read models (mock/in-memory only).
  - name: Platform health
    description: Isolated non-data-bearing operational probes.
  - name: Authentication
    description: Phone-and-OTP registration, login, and session contracts. No email is used anywhere.
  - name: Taxpayer own data
    description: Authenticated taxpayer's own requests, balaghs, and notifications. Own-data only.
paths:
  /api/v1/masterdata/me:
    get:
      operationId: getOwnedMasterdataBundle
      summary: Read the authenticated actor's owned masterdata bundle
      tags: [Master data]
      x-permission: taxpayer.profile.read
      x-authorization-predicates: [OWNERSHIP]
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          {
            description: 'Owned activities, branches, addresses, properties, and ownership records',
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: '#/components/schemas/OwnedMasterdataBundle' },
                  },
              },
          }
  /api/v1/masterdata/activities/{id}:
    parameters: [{ $ref: '#/components/parameters/ActivityId' }]
    get:
      operationId: getOwnedCommercialActivityById
      summary: Read an owned commercial activity summary
      tags: [Master data]
      x-permission: taxpayer.profile.read
      x-authorization-predicates: [OWNERSHIP]
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          {
            description: Owned commercial activity,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        $ref: '#/components/schemas/CommercialActivitySummary',
                      },
                  },
              },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/taxpayers/me:
    get:
      operationId: getOwnedTaxpayerBundle
      summary: Read the authenticated actor's linked taxpayer bundle
      tags: [Taxpayer registry]
      x-permission: taxpayer.profile.read
      x-authorization-predicates: [OWNERSHIP]
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          {
            description: Owned taxpayer with legal entities and masked tax numbers,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: '#/components/schemas/OwnedTaxpayerBundle' },
                  },
              },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/taxpayers/{id}:
    parameters: [{ $ref: '#/components/parameters/TaxpayerId' }]
    get:
      operationId: getOwnedTaxpayerById
      summary: Read an owned taxpayer profile summary
      tags: [Taxpayer registry]
      x-permission: taxpayer.profile.read
      x-authorization-predicates: [OWNERSHIP]
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          {
            description: Owned taxpayer profile,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: '#/components/schemas/TaxpayerProfileResponse' },
                  },
              },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/requests:
    post:
      operationId: createRequestDraft
      summary: Create an activity address change draft
      tags: [Requests]
      x-permission: request.draft.create
      x-authorization-predicates: [OWNERSHIP]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/CreateRequestDraft' } },
          }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          {
            description: Draft created,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/RequestResponse' } },
              },
          }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/requests/{id}:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      operationId: getOwnedRequest
      summary: Read an owned request
      tags: [Requests]
      x-permission: request.read
      x-authorization-predicates: [OWNERSHIP]
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          {
            description: Owned request,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/RequestResponse' } },
              },
          }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: editOwnedRequestDraft
      summary: Replace targets on an owned draft
      tags: [Requests]
      x-permission: request.draft.edit
      x-authorization-predicates: [OWNERSHIP, RESOURCE_STATE]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/EditRequestDraft' } },
          }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          {
            description: Draft updated,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/RequestResponse' } },
              },
          }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/requests/{id}/submit:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      operationId: submitOwnedRequestDraft
      summary: Submit an owned request draft
      tags: [Requests]
      x-permission: request.submit
      x-authorization-predicates: [OWNERSHIP, RESOURCE_STATE]
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          {
            description: Draft submitted,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/RequestResponse' } },
              },
          }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/auth/otp/request:
    post:
      operationId: requestOtp
      summary: Request a one-time sign-in code for a phone number
      description: >-
        PublicEndpoint. Always returns 202 whether or not the phone is
        registered, so user enumeration is impossible. The OTP is delivered
        out-of-band and never appears in any API response.
      tags: [Authentication]
      security: []
      parameters:
        - { $ref: '#/components/parameters/CorrelationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpRequestBody' }
      responses:
        '202':
          description: >-
            Request accepted. The response never reveals whether the phone
            exists and never contains the OTP.
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      summary: Verify a one-time code and issue a short-lived verification token
      description: >-
        PublicEndpoint. On success returns a short-lived, single-purpose
        verification token usable once for registration. Failure returns 422
        with a generic message that does not reveal whether the phone exists.
      tags: [Authentication]
      security: []
      parameters:
        - { $ref: '#/components/parameters/CorrelationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyBody' }
      responses:
        '200':
          description: OTP verified; short-lived verification token issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpVerifyResponse' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/register:
    post:
      operationId: registerTaxpayer
      summary: Register a taxpayer account with a verified phone
      description: >-
        PublicEndpoint. Consumes the OTP verification token and returns a
        token pair on success. Validation failures return 422 with per-field
        details. The access token is short-lived.
      tags: [Authentication]
      security: []
      parameters:
        - { $ref: '#/components/parameters/CorrelationId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterBody' }
      responses:
        '201':
          description: Account registered; token pair issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPairResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/login:
    post:
      operationId: loginWithPhonePassword
      summary: Log in with phone and password
      description: >-
        PublicEndpoint. Failure always returns the same generic 401 message;
        the response never distinguishes an unknown phone from a wrong
        password. After 5 failed attempts the account is temporarily locked
        for 15 minutes and the endpoint returns 429. The access token is
        short-lived.
      tags: [Authentication]
      security: []
      parameters:
        - { $ref: '#/components/parameters/CorrelationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginBody' }
      responses:
        '200':
          description: Login succeeded; token pair issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPairResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/password/reset/request:
    post:
      operationId: requestPasswordReset
      summary: Request a password reset code for a phone number
      description: >-
        PublicEndpoint. Always returns 202 whether or not the phone is
        registered, so user enumeration is impossible. The reset code is
        delivered out-of-band and never appears in any API response.
      tags: [Authentication]
      security: []
      parameters:
        - { $ref: '#/components/parameters/CorrelationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequestBody' }
      responses:
        '202':
          description: >-
            Request accepted. The response never reveals whether the phone
            exists and never contains the reset code.
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/password/reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Confirm a password reset with the out-of-band code
      description: >-
        PublicEndpoint. Sets the new password when the reset code is valid.
        Failure returns 422 with a generic message that does not reveal
        whether the phone exists.
      tags: [Authentication]
      security: []
      parameters:
        - { $ref: '#/components/parameters/CorrelationId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmBody' }
      responses:
        '200':
          description: Password updated. Previous sessions are invalidated.
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/refresh:
    post:
      operationId: refreshTokenPair
      summary: Exchange a refresh token for a new token pair
      description: >-
        Session endpoint authenticated by the refresh-token credential in the
        request body instead of a bearer header. Rotates the token pair; the
        access token is short-lived and the previous refresh token is
        invalidated.
      tags: [Authentication]
      security: []
      parameters:
        - { $ref: '#/components/parameters/CorrelationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshBody' }
      responses:
        '200':
          description: Token pair rotated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPairResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/auth/logout:
    post:
      operationId: logoutCurrentSession
      summary: Invalidate the current session and device
      description: >-
        Session endpoint authenticated with the bearer access token. It is
        session management, not a permission-guarded business operation, so
        it declares no x-permission. Invalidates the current session/device
        and its refresh token.
      tags: [Authentication]
      parameters:
        - { $ref: '#/components/parameters/CorrelationId' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '204':
          description: Session invalidated. No response body.
  /api/v1/me/requests:
    get:
      operationId: listOwnRequests
      summary: List the authenticated taxpayer's own requests
      description: Own-data only; the server scopes every item to the authenticated actor.
      tags: [Taxpayer own data]
      x-permission: request.read
      x-authorization-predicates: [OWNERSHIP]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/CorrelationId' }
        - name: status
          in: query
          description: Optional status filter applied within the actor's own requests only.
          schema: { type: string, minLength: 1 }
        - name: serviceType
          in: query
          description: Optional service type filter.
          schema: { type: string, minLength: 1 }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Cursor-paginated page of the actor's own request summaries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestListPage' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/me/balaghs:
    get:
      operationId: listOwnBalaghs
      summary: List the authenticated taxpayer's own balaghs
      description: Own-data only; the server scopes every item to the authenticated actor.
      tags: [Taxpayer own data]
      x-permission: balagh.read
      x-authorization-predicates: [OWNERSHIP]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/CorrelationId' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Cursor-paginated page of the actor's own balagh summaries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalaghListPage' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/me/notifications:
    get:
      operationId: listOwnNotifications
      summary: List the authenticated taxpayer's own notification inbox
      description: Own-data only; the server scopes every item to the authenticated actor.
      tags: [Taxpayer own data]
      x-permission: notification.read
      x-authorization-predicates: [OWNERSHIP]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/CorrelationId' }
        - name: readStatus
          in: query
          description: Optional read-status filter.
          schema: { type: string, enum: [unread, read] }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Cursor-paginated inbox page with an optional unread count.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationInboxPage' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/me/notifications/{id}/read:
    parameters: [{ $ref: '#/components/parameters/NotificationId' }]
    post:
      operationId: markOwnNotificationRead
      summary: Mark an own notification as read
      description: >-
        Idempotent; returns 200 with the current read state whenever the
        notification is owned by the actor, whether or not it was already
        read.
      tags: [Taxpayer own data]
      x-permission: notification.mark_read
      x-authorization-predicates: [OWNERSHIP]
      parameters:
        - { $ref: '#/components/parameters/CorrelationId' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Notification is read.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationReadResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/balaghs:
    post:
      operationId: createBalaghDraft
      summary: Create a new balagh draft (FR-201 to FR-206)
      tags: [Balaghs]
      x-permission: balagh.create
      x-authorization-predicates: [OWNERSHIP]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBalaghDraft' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Draft created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalaghResponse' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/balaghs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    get:
      operationId: getBalagh
      summary: Read a balagh
      tags: [Balaghs]
      x-permission: balagh.read
      x-authorization-predicates: [OWNERSHIP]
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Balagh details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalaghResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: editBalaghDraft
      summary: Update a balagh draft
      tags: [Balaghs]
      x-permission: balagh.draft.edit
      x-authorization-predicates: [OWNERSHIP, RESOURCE_STATE]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EditBalaghDraft' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Draft updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalaghResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      operationId: deleteBalaghDraft
      summary: Delete a balagh draft
      tags: [Balaghs]
      x-permission: balagh.draft.delete
      x-authorization-predicates: [OWNERSHIP, RESOURCE_STATE]
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '204':
          description: Draft deleted
        '409': { $ref: '#/components/responses/Conflict' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/balaghs/{id}/submit:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    post:
      operationId: submitBalaghDraft
      summary: Submit a balagh draft
      tags: [Balaghs]
      x-permission: balagh.submit
      x-authorization-predicates: [OWNERSHIP, RESOURCE_STATE]
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Draft submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalaghResponse' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/visits:
    post:
      operationId: scheduleFieldVisit
      summary: Schedule a new field visit
      tags: [Field visits]
      x-permission: field_visit.schedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleFieldVisitInput' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Visit scheduled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldVisitResponse' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/visits/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    get:
      operationId: getFieldVisit
      summary: Get details of a field visit
      tags: [Field visits]
      x-permission: request.review
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Visit details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldVisitResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/visits/{id}/results:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    post:
      operationId: recordFieldVisitResult
      summary: Record results of a field visit
      tags: [Field visits]
      x-permission: field_visit.result.record
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordFieldVisitResultInput' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Result recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldVisitResultResponse' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/visits/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    post:
      operationId: cancelFieldVisit
      summary: Cancel a scheduled field visit
      tags: [Field visits]
      x-permission: field_visit.schedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelFieldVisitInput' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Visit cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldVisitResponse' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/decisions:
    post:
      operationId: recordDecision
      summary: Record a decision for a service request
      tags: [Decisions]
      x-permission: request.decision.final
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordDecisionInput' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Decision recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionResponse' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/decisions/{id}/revisions:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    post:
      operationId: reviseDecision
      summary: Revise an existing decision
      tags: [Decisions]
      x-permission: request.decision.final
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviseDecisionInput' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Decision revised
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionRevisionResponse' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/decisions/requests/{requestId}:
    parameters:
      - name: requestId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    get:
      operationId: getDecisionForRequest
      summary: Get decision for a service request
      tags: [Decisions]
      x-permission: request.review
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Decision details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/dues:
    post:
      operationId: assessDue
      summary: Assess a new payment due
      tags: [Dues and payments]
      x-permission: due.register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssessDueInput' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Due assessed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentDueResponse' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/dues/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    get:
      operationId: getDue
      summary: Get details of a payment due
      tags: [Dues and payments]
      x-permission: request.read
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          description: Due details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentDueResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/dues/{id}/corrections:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    post:
      operationId: correctDue
      summary: Correct a payment due
      tags: [Dues and payments]
      x-permission: due.correct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CorrectDueInput' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Due corrected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentDueResponse' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/dues/{id}/receipts:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    post:
      operationId: uploadReceipt
      summary: Upload a payment receipt
      tags: [Dues and payments]
      x-permission: payment.receipt.upload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadReceiptInput' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Receipt uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentReceiptResponse' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/dues/receipts/{receiptId}/confirm:
    parameters:
      - name: receiptId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Uuid' }
    post:
      operationId: confirmPayment
      summary: Confirm a payment receipt
      tags: [Dues and payments]
      x-permission: payment.confirm
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmPaymentInput' }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          description: Payment confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentConfirmationResponse' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      tags: [Platform health]
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /ready:
    get:
      operationId: getReadiness
      summary: Readiness probe
      tags: [Platform health]
      security: []
      responses:
        '200':
          description: Process configuration is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Server-validated bearer token. No token or secret is stored here.
  schemas:
    Uuid:
      type: string
      format: uuid
    RequestAddress:
      type: object
      additionalProperties: false
      required: [district, street]
      properties:
        district: { type: string, minLength: 1 }
        street: { type: string, minLength: 1 }
        neighborhood: { type: [string, 'null'], minLength: 1 }
        buildingNumber: { type: [string, 'null'], minLength: 1 }
        nearbyLandmark: { type: [string, 'null'], minLength: 1 }
    RequestTarget:
      type: object
      additionalProperties: false
      required: [activityId, newAddress]
      properties:
        activityId: { $ref: '#/components/schemas/Uuid' }
        branchId:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }
        newAddress: { $ref: '#/components/schemas/RequestAddress' }
    CreateRequestDraft:
      type: object
      additionalProperties: false
      required: [serviceType, schemaVersion, targets]
      properties:
        serviceType: { type: string, const: activity_address_change }
        schemaVersion: { type: string, const: 1.0.0 }
        targets:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/RequestTarget' }
          description: Activity and branch pairs must be unique.
    EditRequestDraft:
      type: object
      additionalProperties: false
      required: [targets]
      properties:
        targets:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/RequestTarget' }
          description: Fully replaces the draft targets after validation.
    RequestForm:
      type: object
      additionalProperties: false
      required: [serviceType, schemaVersion, data]
      properties:
        serviceType: { type: string, const: activity_address_change }
        schemaVersion: { type: string, const: 1.0.0 }
        data:
          type: object
          additionalProperties: false
          required: [targets]
          properties:
            targets:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/RequestTarget' }
    RequestResponse:
      type: object
      additionalProperties: false
      required: [id, status, form, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [draft, submitted] }
        form: { $ref: '#/components/schemas/RequestForm' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        submittedAt: { type: string, format: date-time }
    TaxpayerProfileResponse:
      type: object
      additionalProperties: false
      required:
        [
          id,
          publicRef,
          displayName,
          statusCode,
          hasTaxNumber,
          activeLegalEntityCount,
          openDuesFlag,
        ]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        publicRef: { type: [string, 'null'], minLength: 1 }
        displayName: { type: string, minLength: 1 }
        statusCode: { type: string, minLength: 1 }
        hasTaxNumber: { type: boolean }
        activeLegalEntityCount: { type: integer, minimum: 0 }
        openDuesFlag: { type: boolean }
    LegalEntitySummary:
      type: object
      additionalProperties: false
      required:
        [
          id,
          publicRef,
          legalName,
          classificationCode,
          isActive,
          associationTypeCode,
        ]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        publicRef: { type: [string, 'null'], minLength: 1 }
        legalName: { type: string, minLength: 1 }
        classificationCode: { type: [string, 'null'], minLength: 1 }
        isActive: { type: boolean }
        associationTypeCode: { type: string, minLength: 1 }
    TaxNumberSummary:
      type: object
      additionalProperties: false
      required: [id, taxNumberValueMasked, statusCode, legalEntityId, issuedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        taxNumberValueMasked: { type: string, minLength: 1 }
        statusCode: { type: string, enum: [issued, invalid, replaced] }
        legalEntityId: { $ref: '#/components/schemas/Uuid' }
        issuedAt: { type: [string, 'null'], format: date-time }
    OwnedTaxpayerBundle:
      type: object
      additionalProperties: false
      required: [taxpayer, legalEntities, taxNumbers]
      properties:
        taxpayer: { $ref: '#/components/schemas/TaxpayerProfileResponse' }
        legalEntities:
          type: array
          items: { $ref: '#/components/schemas/LegalEntitySummary' }
        taxNumbers:
          type: array
          items: { $ref: '#/components/schemas/TaxNumberSummary' }
    CommercialActivitySummary:
      type: object
      additionalProperties: false
      required: [id, publicRef, taxpayerId, name, statusCode]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        publicRef: { type: [string, 'null'], minLength: 1 }
        taxpayerId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, minLength: 1 }
        statusCode: { type: string, minLength: 1 }
    BranchSummary:
      type: object
      additionalProperties: false
      required: [id, publicRef, commercialActivityId, name, statusCode]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        publicRef: { type: [string, 'null'], minLength: 1 }
        commercialActivityId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, minLength: 1 }
        statusCode: { type: string, minLength: 1 }
    ActivityAddressSummary:
      type: object
      additionalProperties: false
      required:
        [
          id,
          commercialActivityId,
          branchId,
          addressLine,
          districtCode,
          effectiveFrom,
          effectiveTo,
        ]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        commercialActivityId:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }
        branchId:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }
        addressLine: { type: [string, 'null'], minLength: 1 }
        districtCode: { type: [string, 'null'], minLength: 1 }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: [string, 'null'], format: date-time }
    PropertySummary:
      type: object
      additionalProperties: false
      required: [id, publicRef, statusCode, description]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        publicRef: { type: [string, 'null'], minLength: 1 }
        statusCode: { type: string, minLength: 1 }
        description: { type: [string, 'null'], minLength: 1 }
    PropertyOwnershipSummary:
      type: object
      additionalProperties: false
      required:
        [
          id,
          propertyId,
          taxpayerId,
          partyRoleCode,
          isCurrent,
          effectiveFrom,
          effectiveTo,
        ]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        propertyId: { $ref: '#/components/schemas/Uuid' }
        taxpayerId: { $ref: '#/components/schemas/Uuid' }
        partyRoleCode: { type: string, minLength: 1 }
        isCurrent: { type: boolean }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: [string, 'null'], format: date-time }
    OwnedMasterdataBundle:
      type: object
      additionalProperties: false
      required: [activities, branches, addresses, properties, ownershipRecords]
      properties:
        activities:
          type: array
          items: { $ref: '#/components/schemas/CommercialActivitySummary' }
        branches:
          type: array
          items: { $ref: '#/components/schemas/BranchSummary' }
        addresses:
          type: array
          items: { $ref: '#/components/schemas/ActivityAddressSummary' }
        properties:
          type: array
          items: { $ref: '#/components/schemas/PropertySummary' }
        ownershipRecords:
          type: array
          items: { $ref: '#/components/schemas/PropertyOwnershipSummary' }
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field: { type: string, minLength: 1 }
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
        message: { type: string, minLength: 1 }
    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message, traceId]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
        message: { type: string, minLength: 1 }
        details:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
        traceId: { type: string, minLength: 1 }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorBody' }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status: { type: string, const: ok }
        service: { type: string, const: marib-tax-api }
        version: { type: string, const: v1 }
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status: { type: string, const: ready }
        service: { type: string, const: marib-tax-api }
        version: { type: string, const: v1 }
    PageMetadata:
      type: object
      additionalProperties: false
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    CursorPageInfo:
      type: object
      additionalProperties: false
      required: [nextCursor, hasMore, pageSize]
      properties:
        nextCursor:
          {
            type: [string, 'null'],
            minLength: 1,
            description: Opaque cursor for the next page; null when hasMore is false.,
          }
        hasMore: { type: boolean }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
    PhoneNumber:
      type: string
      pattern: '^\+[1-9][0-9]{7,14}$'
      description: >-
        E.164 international format. The phone number is the only sign-in
        identifier; no email field exists anywhere in the authentication
        contracts.
    OtpCode:
      type: string
      pattern: '^[0-9]{4,6}$'
      description: Four to six digits, delivered out-of-band only.
    Password:
      type: string
      minLength: 10
      maxLength: 128
      description: >-
        At least 10 characters including one lowercase letter, one uppercase
        letter, one digit, and one symbol.
    OtpRequestBody:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone: { $ref: '#/components/schemas/PhoneNumber' }
    OtpVerifyBody:
      type: object
      additionalProperties: false
      required: [phone, code]
      properties:
        phone: { $ref: '#/components/schemas/PhoneNumber' }
        code: { $ref: '#/components/schemas/OtpCode' }
    OtpVerifyResponse:
      type: object
      additionalProperties: false
      required: [verificationToken]
      properties:
        verificationToken:
          type: string
          minLength: 1
          description: >-
            Short-lived single-purpose token proving OTP verification,
            consumed once by registration. Never the OTP itself.
    RegisterBody:
      type: object
      additionalProperties: false
      required: [phone, password, otpVerificationToken, fullName]
      properties:
        phone: { $ref: '#/components/schemas/PhoneNumber' }
        password: { $ref: '#/components/schemas/Password' }
        otpVerificationToken: { type: string, minLength: 1 }
        fullName: { type: string, minLength: 1, maxLength: 200 }
    LoginBody:
      type: object
      additionalProperties: false
      required: [phone, password]
      properties:
        phone: { $ref: '#/components/schemas/PhoneNumber' }
        password:
          type: string
          minLength: 1
          description: >-
            Password policy is not re-validated at login; any non-empty value
            is checked against the stored credential.
    TokenPairResponse:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, expiresInSeconds, tokenType]
      properties:
        accessToken:
          type: string
          minLength: 1
          description: Short-lived bearer access token.
        refreshToken: { type: string, minLength: 1 }
        expiresInSeconds: { type: integer, minimum: 1 }
        tokenType: { type: string, const: Bearer }
    PasswordResetRequestBody:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone: { $ref: '#/components/schemas/PhoneNumber' }
    PasswordResetConfirmBody:
      type: object
      additionalProperties: false
      required: [phone, code, newPassword]
      properties:
        phone: { $ref: '#/components/schemas/PhoneNumber' }
        code: { $ref: '#/components/schemas/OtpCode' }
        newPassword: { $ref: '#/components/schemas/Password' }
    RefreshBody:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1 }
    RequestListItem:
      type: object
      additionalProperties: false
      required: [id, publicRef, serviceType, status, createdAt, submittedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        publicRef: { type: [string, 'null'], minLength: 1 }
        serviceType: { type: string, minLength: 1 }
        status: { type: string, minLength: 1 }
        createdAt: { type: string, format: date-time }
        submittedAt: { type: [string, 'null'], format: date-time }
    BalaghListItem:
      type: object
      additionalProperties: false
      required: [id, publicRef, balaghType, status, createdAt, submittedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        publicRef: { type: [string, 'null'], minLength: 1 }
        balaghType: { type: string, minLength: 1 }
        status: { type: string, minLength: 1 }
        createdAt: { type: string, format: date-time }
        submittedAt: { type: [string, 'null'], format: date-time }
    NotificationListItem:
      type: object
      additionalProperties: false
      required: [id, type, readStatus, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        type: { type: string, minLength: 1 }
        readStatus: { type: string, enum: [unread, read] }
        createdAt: { type: string, format: date-time }
    RequestListPage:
      type: object
      additionalProperties: false
      required: [items, pageInfo]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RequestListItem' }
        pageInfo: { $ref: '#/components/schemas/CursorPageInfo' }
    BalaghListPage:
      type: object
      additionalProperties: false
      required: [items, pageInfo]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BalaghListItem' }
        pageInfo: { $ref: '#/components/schemas/CursorPageInfo' }
    NotificationInboxPage:
      type: object
      additionalProperties: false
      required: [items, pageInfo]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/NotificationListItem' }
        pageInfo: { $ref: '#/components/schemas/CursorPageInfo' }
        unreadCount: { type: integer, minimum: 0 }
    NotificationReadResponse:
      type: object
      additionalProperties: false
      required: [id, readAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        readAt: { type: string, format: date-time }
    CreateBalaghDraft:
      type: object
      additionalProperties: false
      required: [balaghType, schemaVersion, formData]
      properties:
        balaghType: { type: string, enum: [FR-201, FR-202, FR-203, FR-204, FR-205, FR-206] }
        schemaVersion: { type: string, const: 1.0.0 }
        formData: { type: object }
    EditBalaghDraft:
      type: object
      additionalProperties: false
      required: [formData]
      properties:
        formData: { type: object }
    BalaghResponse:
      type: object
      additionalProperties: false
      required: [id, publicRef, status, balaghType, schemaVersion, formData, ownerActorId, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        publicRef: { type: [string, 'null'] }
        status: { type: string, enum: [draft, submitted, under_review, field_visit_scheduled, field_visit_completed, approved, rejected, archived] }
        balaghType: { type: string, enum: [FR-201, FR-202, FR-203, FR-204, FR-205, FR-206] }
        schemaVersion: { type: string, const: 1.0.0 }
        formData: { type: object }
        ownerActorId: { $ref: '#/components/schemas/Uuid' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        submittedAt: { type: [string, 'null'], format: date-time }
    ScheduleFieldVisitInput:
      type: object
      additionalProperties: false
      required: [scheduledStartAt, scheduledEndAt, teamMemberStaffIds]
      properties:
        serviceRequestId: { type: [string, 'null'], format: uuid }
        balaghId: { type: [string, 'null'], format: uuid }
        scheduledStartAt: { type: string, format: date-time }
        scheduledEndAt: { type: string, format: date-time }
        teamMemberStaffIds:
          type: array
          items: { $ref: '#/components/schemas/Uuid' }
          minItems: 1
        locationSnapshot: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
    RecordFieldVisitResultInput:
      type: object
      additionalProperties: false
      required: [resultSummary, actualStartedAt, actualEndedAt]
      properties:
        resultSummary: { type: string, minLength: 1 }
        resultCode: { type: [string, 'null'] }
        actualStartedAt: { type: string, format: date-time }
        actualEndedAt: { type: string, format: date-time }
    CancelFieldVisitInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
    FieldVisitResponse:
      type: object
      additionalProperties: false
      required: [id, publicRef, serviceRequestId, balaghId, statusCode, actualStartedAt, actualEndedAt, locationSnapshot, notes, cancellationReason, createdByStaffProfileId, createdByProfileId, updatedAt, updatedByProfileId, archivedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        publicRef: { type: [string, 'null'] }
        serviceRequestId: { type: [string, 'null'], format: uuid }
        balaghId: { type: [string, 'null'], format: uuid }
        statusCode: { type: string, enum: [scheduled, completed, cancelled] }
        actualStartedAt: { type: [string, 'null'], format: date-time }
        actualEndedAt: { type: [string, 'null'], format: date-time }
        locationSnapshot: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        cancellationReason: { type: [string, 'null'] }
        createdByStaffProfileId: { $ref: '#/components/schemas/Uuid' }
        createdByProfileId: { type: [string, 'null'], format: uuid }
        updatedAt: { type: [string, 'null'], format: date-time }
