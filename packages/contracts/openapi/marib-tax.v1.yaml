openapi: 3.1.0
info:
  title: Marib Tax API
  version: 1.0.0
  description: Authoritative API-01 foundation. Business operations use the /api/v1 prefix.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:{port}
    description: Local development placeholder
    variables:
      port:
        default: '3000'
x-business-api-prefix: /api/v1
x-permission-codes:
  catalog: '@marib-tax/contracts#permissionCodes'
  rule: Every business operation must declare one approved x-permission value.
x-authorization-predicates:
  - OWNERSHIP
  - ACTIVE_ASSIGNMENT
  - OFFICE_SCOPE
  - UNIT_SCOPE
  - RESOURCE_STATE
  - SEPARATION_OF_DUTIES
  - REQUIRED_EVIDENCE
tags:
  - name: Requests
    description: Taxpayer-owned service request contracts.
  - name: Taxpayer registry
    description: Owned taxpayer, legal-entity, and tax-number read models (mock/in-memory only).
  - name: Master data
    description: Owned commercial-activity, branch, address, and property read models (mock/in-memory only).
  - name: Platform health
    description: Isolated non-data-bearing operational probes.
paths:
  /api/v1/masterdata/me:
    get:
      operationId: getOwnedMasterdataBundle
      summary: Read the authenticated actor's owned masterdata bundle
      tags: [Master data]
      x-permission: taxpayer.profile.read
      x-authorization-predicates: [OWNERSHIP]
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          {
            description: Owned activities, branches, addresses, properties, and ownership records,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: '#/components/schemas/OwnedMasterdataBundle' },
                  },
              },
          }
  /api/v1/masterdata/activities/{id}:
    parameters: [{ $ref: '#/components/parameters/ActivityId' }]
    get:
      operationId: getOwnedCommercialActivityById
      summary: Read an owned commercial activity summary
      tags: [Master data]
      x-permission: taxpayer.profile.read
      x-authorization-predicates: [OWNERSHIP]
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          {
            description: Owned commercial activity,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: '#/components/schemas/CommercialActivitySummary' },
                  },
              },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/taxpayers/me:
    get:
      operationId: getOwnedTaxpayerBundle
      summary: Read the authenticated actor's linked taxpayer bundle
      tags: [Taxpayer registry]
      x-permission: taxpayer.profile.read
      x-authorization-predicates: [OWNERSHIP]
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          {
            description: Owned taxpayer with legal entities and masked tax numbers,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: '#/components/schemas/OwnedTaxpayerBundle' },
                  },
              },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/taxpayers/{id}:
    parameters: [{ $ref: '#/components/parameters/TaxpayerId' }]
    get:
      operationId: getOwnedTaxpayerById
      summary: Read an owned taxpayer profile summary
      tags: [Taxpayer registry]
      x-permission: taxpayer.profile.read
      x-authorization-predicates: [OWNERSHIP]
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          {
            description: Owned taxpayer profile,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: '#/components/schemas/TaxpayerProfileResponse' },
                  },
              },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/requests:
    post:
      operationId: createRequestDraft
      summary: Create an activity address change draft
      tags: [Requests]
      x-permission: request.draft.create
      x-authorization-predicates: [OWNERSHIP]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/CreateRequestDraft' } },
          }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '201':
          {
            description: Draft created,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/RequestResponse' } },
              },
          }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/requests/{id}:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    get:
      operationId: getOwnedRequest
      summary: Read an owned request
      tags: [Requests]
      x-permission: request.read
      x-authorization-predicates: [OWNERSHIP]
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          {
            description: Owned request,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/RequestResponse' } },
              },
          }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: editOwnedRequestDraft
      summary: Replace targets on an owned draft
      tags: [Requests]
      x-permission: request.draft.edit
      x-authorization-predicates: [OWNERSHIP, RESOURCE_STATE]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: '#/components/schemas/EditRequestDraft' } },
          }
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          {
            description: Draft updated,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/RequestResponse' } },
              },
          }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/requests/{id}/submit:
    parameters: [{ $ref: '#/components/parameters/RequestId' }]
    post:
      operationId: submitOwnedRequestDraft
      summary: Submit an owned request draft
      tags: [Requests]
      x-permission: request.submit
      x-authorization-predicates: [OWNERSHIP, RESOURCE_STATE]
      responses:
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '200':
          {
            description: Draft submitted,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/RequestResponse' } },
              },
          }
        '409': { $ref: '#/components/responses/Conflict' }
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      tags: [Platform health]
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /ready:
    get:
      operationId: getReadiness
      summary: Readiness probe
      tags: [Platform health]
      security: []
      responses:
        '200':
          description: Process configuration is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Server-validated bearer token. No token or secret is stored here.
  schemas:
    Uuid:
      type: string
      format: uuid
    RequestAddress:
      type: object
      additionalProperties: false
      required: [district, street]
      properties:
        district: { type: string, minLength: 1 }
        street: { type: string, minLength: 1 }
        neighborhood: { type: [string, 'null'], minLength: 1 }
        buildingNumber: { type: [string, 'null'], minLength: 1 }
        nearbyLandmark: { type: [string, 'null'], minLength: 1 }
    RequestTarget:
      type: object
      additionalProperties: false
      required: [activityId, newAddress]
      properties:
        activityId: { $ref: '#/components/schemas/Uuid' }
        branchId:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }
        newAddress: { $ref: '#/components/schemas/RequestAddress' }
    CreateRequestDraft:
      type: object
      additionalProperties: false
      required: [serviceType, schemaVersion, targets]
      properties:
        serviceType: { type: string, const: activity_address_change }
        schemaVersion: { type: string, const: 1.0.0 }
        targets:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/RequestTarget' }
          description: Activity and branch pairs must be unique.
    EditRequestDraft:
      type: object
      additionalProperties: false
      required: [targets]
      properties:
        targets:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/RequestTarget' }
          description: Fully replaces the draft targets after validation.
    RequestForm:
      type: object
      additionalProperties: false
      required: [serviceType, schemaVersion, data]
      properties:
        serviceType: { type: string, const: activity_address_change }
        schemaVersion: { type: string, const: 1.0.0 }
        data:
          type: object
          additionalProperties: false
          required: [targets]
          properties:
            targets:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/RequestTarget' }
    RequestResponse:
      type: object
      additionalProperties: false
      required: [id, status, form, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [draft, submitted] }
        form: { $ref: '#/components/schemas/RequestForm' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        submittedAt: { type: string, format: date-time }
    TaxpayerProfileResponse:
      type: object
      additionalProperties: false
      required:
        [
          id,
          publicRef,
          displayName,
          statusCode,
          hasTaxNumber,
          activeLegalEntityCount,
          openDuesFlag,
        ]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        publicRef: { type: [string, 'null'], minLength: 1 }
        displayName: { type: string, minLength: 1 }
        statusCode: { type: string, minLength: 1 }
        hasTaxNumber: { type: boolean }
        activeLegalEntityCount: { type: integer, minimum: 0 }
        openDuesFlag: { type: boolean }
    LegalEntitySummary:
      type: object
      additionalProperties: false
      required:
        [
          id,
          publicRef,
          legalName,
          classificationCode,
          isActive,
          associationTypeCode,
        ]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        publicRef: { type: [string, 'null'], minLength: 1 }
        legalName: { type: string, minLength: 1 }
        classificationCode: { type: [string, 'null'], minLength: 1 }
        isActive: { type: boolean }
        associationTypeCode: { type: string, minLength: 1 }
    TaxNumberSummary:
      type: object
      additionalProperties: false
      required: [id, taxNumberValueMasked, statusCode, legalEntityId, issuedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        taxNumberValueMasked: { type: string, minLength: 1 }
        statusCode: { type: string, enum: [issued, invalid, replaced] }
        legalEntityId: { $ref: '#/components/schemas/Uuid' }
        issuedAt: { type: [string, 'null'], format: date-time }
    OwnedTaxpayerBundle:
      type: object
      additionalProperties: false
      required: [taxpayer, legalEntities, taxNumbers]
      properties:
        taxpayer: { $ref: '#/components/schemas/TaxpayerProfileResponse' }
        legalEntities:
          type: array
          items: { $ref: '#/components/schemas/LegalEntitySummary' }
        taxNumbers:
          type: array
          items: { $ref: '#/components/schemas/TaxNumberSummary' }
    CommercialActivitySummary:
      type: object
      additionalProperties: false
      required: [id, publicRef, taxpayerId, name, statusCode]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        publicRef: { type: [string, 'null'], minLength: 1 }
        taxpayerId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, minLength: 1 }
        statusCode: { type: string, minLength: 1 }
    BranchSummary:
      type: object
      additionalProperties: false
      required: [id, publicRef, commercialActivityId, name, statusCode]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        publicRef: { type: [string, 'null'], minLength: 1 }
        commercialActivityId: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, minLength: 1 }
        statusCode: { type: string, minLength: 1 }
    ActivityAddressSummary:
      type: object
      additionalProperties: false
      required:
        [
          id,
          commercialActivityId,
          branchId,
          addressLine,
          districtCode,
          effectiveFrom,
          effectiveTo,
        ]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        commercialActivityId:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }
        branchId:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }
        addressLine: { type: [string, 'null'], minLength: 1 }
        districtCode: { type: [string, 'null'], minLength: 1 }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: [string, 'null'], format: date-time }
    PropertySummary:
      type: object
      additionalProperties: false
      required: [id, publicRef, statusCode, description]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        publicRef: { type: [string, 'null'], minLength: 1 }
        statusCode: { type: string, minLength: 1 }
        description: { type: [string, 'null'], minLength: 1 }
    PropertyOwnershipSummary:
      type: object
      additionalProperties: false
      required:
        [
          id,
          propertyId,
          taxpayerId,
          partyRoleCode,
          isCurrent,
          effectiveFrom,
          effectiveTo,
        ]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        propertyId: { $ref: '#/components/schemas/Uuid' }
        taxpayerId: { $ref: '#/components/schemas/Uuid' }
        partyRoleCode: { type: string, minLength: 1 }
        isCurrent: { type: boolean }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: [string, 'null'], format: date-time }
    OwnedMasterdataBundle:
      type: object
      additionalProperties: false
      required:
        [activities, branches, addresses, properties, ownershipRecords]
      properties:
        activities:
          type: array
          items: { $ref: '#/components/schemas/CommercialActivitySummary' }
        branches:
          type: array
          items: { $ref: '#/components/schemas/BranchSummary' }
        addresses:
          type: array
          items: { $ref: '#/components/schemas/ActivityAddressSummary' }
        properties:
          type: array
          items: { $ref: '#/components/schemas/PropertySummary' }
        ownershipRecords:
          type: array
          items: { $ref: '#/components/schemas/PropertyOwnershipSummary' }
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field: { type: string, minLength: 1 }
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
        message: { type: string, minLength: 1 }
    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message, traceId]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
        message: { type: string, minLength: 1 }
        details:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
        traceId: { type: string, minLength: 1 }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorBody' }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status: { type: string, const: ok }
        service: { type: string, const: marib-tax-api }
        version: { type: string, const: v1 }
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status: { type: string, const: ready }
        service: { type: string, const: marib-tax-api }
        version: { type: string, const: v1 }
    PageMetadata:
      type: object
      additionalProperties: false
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
  parameters:
    RequestId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    TaxpayerId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ActivityId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    Unauthenticated:
      description: A valid server-verifiable bearer identity is required.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: The verified actor is not authorized for this operation or resource.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: The request is not in the required resource state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationFailed:
      description: The request body does not satisfy the published contract.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: The requested route or resource is unavailable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    TooManyRequests:
      description: Request rate limit exceeded.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServiceUnavailable:
      description: Service is not ready. The response contains no dependency internals.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
security:
  - bearerAuth: []
